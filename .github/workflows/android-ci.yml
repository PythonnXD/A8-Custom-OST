name: Android Build & Test CI

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'

jobs:
  build-and-test-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android NDK and CMake 3.22.1
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.1.12297006"

      - name: Run Android unit tests
        working-directory: android
        run: |
          set -o pipefail
          if ! gradle testDebugUnitTest --stacktrace 2>&1 | tee /tmp/gradle_test.log; then
            grep -E "^(e: |ERROR:|FAILURE:|> |.*Exception|.*AssertionError|.*FAILED)" /tmp/gradle_test.log | tail -n 25 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Compile Android debug APK
        working-directory: android
        run: |
          set -o pipefail
          if ! gradle assembleDebug --stacktrace 2>&1 | tee /tmp/gradle_build.log; then
            grep -E "^(e: |ERROR:|FAILURE:|> |.*Exception)" /tmp/gradle_build.log | tail -n 25 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
