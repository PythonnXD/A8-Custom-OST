name: Build and Publish Android Release

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Android release tag name (e.g. android-v1.0.0)'
        required: true
        default: 'android-v1.0.0'

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android NDK and CMake 3.22.1
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.1.12297006"

      - name: Prepare release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS_PATH="$RUNNER_TEMP/a8ost-release.jks"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
            echo "ANDROID_KEYSTORE_PATH=$KS_PATH" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore "$KS_PATH" -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias a8ost -storepass a8ostpatcher -keypass a8ostpatcher \
              -dname "CN=Asphalt 8 Custom OST Patcher, OU=Android, O=PythonnXD, L=Global, S=Global, C=US"
            echo "ANDROID_KEYSTORE_PATH=$KS_PATH" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=a8ostpatcher" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=a8ost" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=a8ostpatcher" >> $GITHUB_ENV
          fi

      - name: Run Android engine unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease --stacktrace

      - name: Verify APK signature and native Musepack libraries
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VER="${TAG#android-v}"
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          APK_OUT="dist/A8_Custom_OST_Patcher-Android-v${VER}.apk"
          mkdir -p dist
          cp "$APK_SRC" "$APK_OUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK_OUT"
          unzip -l "$APK_OUT" | grep -E "lib/arm64-v8a/liba8mpc.so|lib/armeabi-v7a/liba8mpc.so|classes.dex"
          ls -lh "$APK_OUT"
          echo "APK_OUT=$APK_OUT" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "ANDROID_VER=$VER" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: A8_Custom_OST_Patcher-Android-${{ env.RELEASE_TAG }}
          path: ${{ env.APK_OUT }}

      - name: Publish Android GitHub Release (separate from PC latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          VER="$ANDROID_VER"
          NOTES_FILE=""
          if [ -f "CHANGELOG_ANDROID.md" ]; then
            awk -v tag="$TAG" '
              $0 ~ "^##[[:space:]]+" tag "([[:space:]]|$)" { in_sec=1; next }
              in_sec && $0 ~ "^##[[:space:]]+" { exit }
              in_sec { print }
            ' CHANGELOG_ANDROID.md > android_release_notes.md
            if [ -s android_release_notes.md ]; then
              NOTES_FILE="android_release_notes.md"
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_OUT" --clobber
            if [ -n "$NOTES_FILE" ]; then
              gh release edit "$TAG" --title "Asphalt 8 Custom OST Patcher (Android v${VER})" --notes-file "$NOTES_FILE" --draft=false --latest=false
            else
              gh release edit "$TAG" --title "Asphalt 8 Custom OST Patcher (Android v${VER})" --draft=false --latest=false
            fi
          else
            if [ -n "$NOTES_FILE" ]; then
              gh release create "$TAG" "$APK_OUT" --title "Asphalt 8 Custom OST Patcher (Android v${VER})" --notes-file "$NOTES_FILE" --latest=false
            else
              gh release create "$TAG" "$APK_OUT" --title "Asphalt 8 Custom OST Patcher (Android v${VER})" --generate-notes --latest=false
            fi
          fi
